<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>History | CloudCalc Pro</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ================= SIDEBAR ================= */

        .sidebar {
            position: fixed;
            left: 18px;
            top: 18px;
            bottom: 18px;
            width: 245px;
            z-index: 100;

            display: flex;
            flex-direction: column;
            padding: 22px 15px;

            border: 1px solid rgba(95,160,255,.22);
            border-radius: 22px;

            background:
                linear-gradient(
                    145deg,
                    rgba(15,28,58,.92),
                    rgba(5,12,28,.96)
                );

            box-shadow:
                0 30px 70px rgba(0,0,0,.45),
                inset 0 1px 0 rgba(255,255,255,.06);

            backdrop-filter: blur(20px);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 11px;

            padding: 4px 8px 25px;

            border-bottom: 1px solid rgba(100,140,200,.10);
        }

        .brand-icon {
            width: 40px;
            height: 40px;

            display: grid;
            place-items: center;

            border-radius: 12px;

            background:
                linear-gradient(145deg,#3182ff,#6145ed);

            box-shadow:
                0 10px 25px rgba(49,130,255,.28);

            font-size: 19px;
            font-weight: 900;
        }

        .brand-name {
            font-size: 16px;
            font-weight: 900;
        }

        .brand-name span {
            color: var(--cyan);
        }

        .nav-section {
            margin-top: 25px;
        }

        .nav-title {
            padding: 0 10px 9px;

            color: #536582;
            font-size: 9px;
            font-weight: 800;
            letter-spacing: 1.3px;
        }

        .nav-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;

            min-height: 44px;
            padding: 0 12px;

            border: 1px solid transparent;
            border-radius: 11px;

            color: var(--text-soft);
            font-size: 12px;

            text-decoration: none;

            transition: all .25s ease;
        }

        .nav-link:hover {
            color: white;
            background: rgba(49,130,255,.07);
            border-color: rgba(95,160,255,.12);
            transform: translateX(3px);
        }

        .nav-link.active {
            color: white;

            background:
                linear-gradient(
                    90deg,
                    rgba(49,130,255,.17),
                    rgba(96,72,237,.08)
                );

            border-color: rgba(95,160,255,.22);

            box-shadow:
                inset 3px 0 0 var(--blue);
        }

        .nav-icon {
            width: 28px;
            height: 28px;

            display: grid;
            place-items: center;

            border-radius: 8px;

            background: rgba(100,140,200,.07);
        }

        .sidebar-bottom {
            margin-top: auto;
        }

        .user-mini {
            display: flex;
            align-items: center;
            gap: 10px;

            padding: 11px;
            margin-bottom: 8px;

            border: 1px solid rgba(100,140,200,.12);
            border-radius: 12px;

            background: rgba(100,140,200,.035);
        }

        .user-avatar {
            width: 34px;
            height: 34px;

            display: grid;
            place-items: center;

            border-radius: 10px;

            background:
                linear-gradient(145deg,#3182ff,#6548ed);

            font-size: 12px;
            font-weight: 900;
        }

        .user-info {
            min-width: 0;
        }

        .user-name {
            color: white;
            font-size: 11px;
            font-weight: 700;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .user-email {
            color: #647696;
            font-size: 9px;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .logout-btn {
            width: 100%;
            height: 38px;

            border: 1px solid rgba(255,90,110,.12);
            border-radius: 10px;

            background: rgba(255,70,90,.035);
            color: #c77b89;

            cursor: pointer;
        }

        .logout-btn:hover {
            background: rgba(255,70,90,.09);
        }


        /* ================= MAIN ================= */

        .main-content {
            min-height: 100vh;
            margin-left: 281px;
            padding: 30px 32px 50px;
        }

        .topbar {
            display: flex;
            align-items: center;
            margin-bottom: 28px;
        }

        .topbar-inner {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .page-heading h1 {
            margin: 0 0 5px;

            font-size: 30px;
            letter-spacing: -1.2px;
        }

        .page-heading p {
            margin: 0;

            color: var(--text-soft);
            font-size: 12px;
        }

        .mobile-menu {
            display: none;

            width: 40px;
            height: 40px;

            border: 1px solid rgba(100,140,200,.18);
            border-radius: 10px;

            background: rgba(15,28,58,.7);
            color: white;

            cursor: pointer;
        }


        /* ================= HISTORY ================= */

        .history-card {
            max-width: 1100px;

            padding: 22px;

            border: 1px solid rgba(95,160,255,.18);
            border-radius: 21px;

            background:
                linear-gradient(
                    145deg,
                    rgba(16,31,63,.82),
                    rgba(5,12,28,.94)
                );

            box-shadow:
                0 25px 60px rgba(0,0,0,.28),
                inset 0 1px 0 rgba(255,255,255,.05);
        }

        .history-header {
            display: grid;
            grid-template-columns:
                minmax(180px, 1.8fr)
                minmax(120px, .8fr)
                minmax(100px, .7fr)
                80px;

            gap: 15px;

            padding: 0 15px 12px;

            border-bottom: 1px solid rgba(100,140,200,.10);

            color: #536582;

            font-size: 9px;
            font-weight: 800;

            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .history-list {
            display: flex;
            flex-direction: column;
        }

        .history-row {
            display: grid;

            grid-template-columns:
                minmax(180px, 1.8fr)
                minmax(120px, .8fr)
                minmax(100px, .7fr)
                80px;

            gap: 15px;

            align-items: center;

            min-height: 70px;

            padding: 12px 15px;

            border-bottom: 1px solid rgba(100,140,200,.07);

            transition: .25s ease;
        }

        .history-row:last-child {
            border-bottom: 0;
        }

        .history-row:hover {
            background: rgba(49,130,255,.035);
            transform: translateX(2px);
        }

        .history-expression {
            min-width: 0;
        }

        .history-expression strong {
            display: block;

            color: #e8effb;

            font-size: 12px;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-expression small {
            display: block;

            margin-top: 5px;

            color: #5d708f;

            font-size: 9px;
        }

        .history-result {
            color: #61d8ff;

            font-size: 13px;
            font-weight: 800;

            word-break: break-word;
        }

        .history-operation {
            color: #8798b3;

            font-size: 10px;

            text-transform: capitalize;
        }

        .delete-history {
            height: 32px;

            padding: 0 9px;

            border: 1px solid rgba(255,80,105,.15);
            border-radius: 8px;

            background: rgba(255,70,90,.035);

            color: #d17b89;

            font-size: 9px;
            font-weight: 700;

            cursor: pointer;

            transition: .2s ease;
        }

        .delete-history:hover {
            background: rgba(255,70,90,.10);
            border-color: rgba(255,80,105,.28);
        }

        .empty-state {
            min-height: 250px;

            display: grid;
            place-items: center;

            text-align: center;

            color: #5f7190;

            font-size: 11px;
        }

        .loading-state {
            min-height: 180px;

            display: grid;
            place-items: center;

            color: #6d82a3;

            font-size: 11px;
        }


        /* ================= TOAST ================= */

        .toast {
            position: fixed;

            right: 25px;
            bottom: 25px;

            z-index: 999;

            padding: 13px 18px;

            border: 1px solid rgba(95,160,255,.20);
            border-radius: 12px;

            background: rgba(9,20,42,.96);

            color: white;
            font-size: 11px;

            box-shadow:
                0 15px 40px rgba(0,0,0,.35);

            transform: translateY(30px);
            opacity: 0;

            pointer-events: none;

            transition: all .25s ease;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }


        /* ================= RESPONSIVE ================= */

        @media (max-width: 900px) {

            .history-header,
            .history-row {
                grid-template-columns:
                    minmax(160px, 1.5fr)
                    minmax(110px, .8fr)
                    90px;
            }

            .history-header > div:nth-child(3),
            .history-row > div:nth-child(3) {
                display: none;
            }

        }


        @media (max-width: 850px) {

            .sidebar {
                transform: translateX(-120%);
                transition: transform .3s ease;
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .main-content {
                margin-left: 0;
                padding: 22px 18px 35px;
            }

            .mobile-menu {
                display: grid;
                place-items: center;
            }

        }


        @media (max-width: 600px) {

            .history-card {
                padding: 14px;
            }

            .history-header {
                display: none;
            }

            .history-row {
                grid-template-columns: 1fr auto;

                gap: 10px;

                padding: 15px 8px;
            }

            .history-result {
                text-align: right;
            }

            .history-operation {
                display: none;
            }

            .delete-history {
                grid-column: 2;
                grid-row: 2;
            }

            .page-heading h1 {
                font-size: 24px;
            }

            .toast {
                left: 18px;
                right: 18px;
                bottom: 18px;

                text-align: center;
            }

        }

    </style>

</head>


<body>

    <div class="background-grid"></div>

    <div class="glow glow-blue"></div>
    <div class="glow glow-purple"></div>
    <div class="glow glow-cyan"></div>


    <!-- ================= SIDEBAR ================= -->

    <aside class="sidebar" id="sidebar">

        <div class="brand">

            <div class="brand-icon">
                C
            </div>

            <div class="brand-name">
                CloudCalc <span>PRO</span>
            </div>

        </div>


        <div class="nav-section">

            <div class="nav-title">
                WORKSPACE
            </div>

            <nav class="nav-list">

                <a href="dashboard.html" class="nav-link">
                    <span class="nav-icon">◈</span>
                    Dashboard
                </a>

                <a href="calculator.html" class="nav-link">
                    <span class="nav-icon">+</span>
                    Calculator
                </a>

                <a href="history.html" class="nav-link active">
                    <span class="nav-icon">↺</span>
                    History
                </a>

                <a href="analytics.html" class="nav-link">
                    <span class="nav-icon">◒</span>
                    Analytics
                </a>

            </nav>

        </div>


        <div class="nav-section">

            <div class="nav-title">
                ACCOUNT
            </div>

            <nav class="nav-list">

                <a href="profile.html" class="nav-link">
                    <span class="nav-icon">◎</span>
                    Profile
                </a>

                <a href="settings.html" class="nav-link">
                    <span class="nav-icon">⚙</span>
                    Settings
                </a>

            </nav>

        </div>


        <div class="sidebar-bottom">

            <div class="user-mini">

                <div
                    class="user-avatar"
                    id="userAvatar"
                >
                    U
                </div>

                <div class="user-info">

                    <div
                        class="user-name"
                        id="userName"
                    >
                        User
                    </div>

                    <div
                        class="user-email"
                        id="userEmail"
                    >
                        Loading...
                    </div>

                </div>

            </div>


            <button
                class="logout-btn"
                id="logoutBtn"
                type="button"
            >
                Sign out
            </button>

        </div>

    </aside>


    <!-- ================= MAIN ================= -->

    <main class="main-content">

        <header class="topbar">

            <div class="topbar-inner">

                <button
                    class="mobile-menu"
                    id="mobileMenu"
                    type="button"
                >
                    ☰
                </button>

                <div class="page-heading">

                    <h1>
                        Calculation History
                    </h1>

                    <p>
                        View and manage your saved calculations.
                    </p>

                </div>

            </div>

        </header>


        <!-- ================= HISTORY CARD ================= -->

        <section class="history-card">

            <div class="history-header">

                <div>
                    Expression
                </div>

                <div>
                    Result
                </div>

                <div>
                    Operation
                </div>

                <div>
                    Action
                </div>

            </div>


            <div
                id="historyList"
                class="history-list"
            >

                <div class="loading-state">
                    Loading calculation history...
                </div>

            </div>

        </section>

    </main>


    <!-- ================= TOAST ================= -->

    <div
        class="toast"
        id="toast"
    ></div>


    <!-- ================= SCRIPTS ================= -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/supabaseClient.js"></script>

<script src="../js/pages/history.js"></script>
</body>

</html>
