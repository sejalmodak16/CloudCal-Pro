<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Profile | CloudCalc Pro</title>

    <link rel="stylesheet"
          href="../css/style.css">

    <link rel="stylesheet"
          href="../css/responsive.css">

    <style>

        /* =====================================================
           CLOUDCALC PRO
           3D PROFILE PAGE
        ===================================================== */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;

            background:
                radial-gradient(
                    circle at top left,
                    #243b68,
                    #0b1020 45%,
                    #050711
                );

            color: #ffffff;
            overflow-x: hidden;
        }


        /* =====================================================
           BACKGROUND
        ===================================================== */

        .profile-bg {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .profile-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(2px);
            opacity: 0.35;
        }

        .orb-one {
            width: 280px;
            height: 280px;

            top: -80px;
            right: -50px;

            background:
                radial-gradient(
                    circle,
                    #4facfe,
                    transparent 70%
                );
        }

        .orb-two {
            width: 350px;
            height: 350px;

            bottom: -150px;
            left: -120px;

            background:
                radial-gradient(
                    circle,
                    #7b61ff,
                    transparent 70%
                );
        }


        /* =====================================================
           MAIN LAYOUT
        ===================================================== */

        .profile-page {
            position: relative;
            z-index: 1;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 40px 20px;
        }


        /* =====================================================
           CARD
        ===================================================== */

        .profile-card {
            width: 100%;
            max-width: 760px;

            padding: 38px;

            border-radius: 28px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.12),
                    rgba(255,255,255,0.04)
                );

            border:
                1px solid
                rgba(255,255,255,0.15);

            box-shadow:
                0 35px 80px
                rgba(0,0,0,0.45),

                inset 0 1px 1px
                rgba(255,255,255,0.15);

            backdrop-filter: blur(20px);

            transform:
                perspective(1200px)
                rotateX(1deg);

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease;
        }

        .profile-card:hover {
            transform:
                perspective(1200px)
                rotateX(0deg)
                translateY(-4px);

            box-shadow:
                0 45px 100px
                rgba(0,0,0,0.55);
        }


        /* =====================================================
           HEADER
        ===================================================== */

        .profile-header {
            display: flex;
            align-items: center;
            gap: 22px;

            margin-bottom: 35px;
        }


        .profile-avatar {
            width: 90px;
            height: 90px;

            flex-shrink: 0;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 34px;
            font-weight: 800;

            color: #ffffff;

            background:
                linear-gradient(
                    145deg,
                    #4facfe,
                    #6c63ff
                );

            box-shadow:
                0 15px 35px
                rgba(79,172,254,0.35),

                inset 0 2px 3px
                rgba(255,255,255,0.35);
        }


        .profile-title h1 {
            margin: 0 0 7px;

            font-size: 30px;
            letter-spacing: -0.5px;
        }

        .profile-title p {
            margin: 0;

            color:
                rgba(255,255,255,0.65);

            font-size: 14px;
        }


        /* =====================================================
           FORM
        ===================================================== */

        .profile-form {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 22px;
        }


        .form-group {
            display: flex;
            flex-direction: column;
            gap: 9px;
        }


        .form-group.full {
            grid-column: 1 / -1;
        }


        .form-group label {
            font-size: 13px;
            font-weight: 700;

            color:
                rgba(255,255,255,0.75);
        }


        .profile-input {
            width: 100%;

            padding: 15px 17px;

            border-radius: 14px;

            border:
                1px solid
                rgba(255,255,255,0.12);

            outline: none;

            color: #ffffff;

            background:
                rgba(0,0,0,0.22);

            box-shadow:
                inset 0 2px 8px
                rgba(0,0,0,0.2);

            font-size: 15px;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }


        .profile-input:focus {
            border-color:
                rgba(79,172,254,0.8);

            box-shadow:
                0 0 0 3px
                rgba(79,172,254,0.12),

                inset 0 2px 8px
                rgba(0,0,0,0.2);
        }


        .profile-input[readonly] {
            opacity: 0.65;
            cursor: not-allowed;
        }


        /* =====================================================
           BUTTONS
        ===================================================== */

        .profile-actions {
            display: flex;
            gap: 14px;

            margin-top: 30px;
        }


        .profile-btn {
            border: none;
            outline: none;

            padding: 14px 24px;

            border-radius: 14px;

            font-size: 14px;
            font-weight: 700;

            cursor: pointer;

            color: #ffffff;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                opacity 0.2s ease;
        }


        .profile-btn:hover {
            transform: translateY(-2px);
        }


        .profile-btn:active {
            transform:
                translateY(1px)
                scale(0.98);
        }


        .save-btn {
            background:
                linear-gradient(
                    135deg,
                    #4facfe,
                    #667eea
                );

            box-shadow:
                0 12px 25px
                rgba(79,172,254,0.25);
        }


        .logout-btn {
            background:
                rgba(255,255,255,0.08);

            border:
                1px solid
                rgba(255,255,255,0.12);
        }


        .logout-btn:hover {
            background:
                rgba(255,80,100,0.15);
        }


        /* =====================================================
           ACCOUNT INFO
        ===================================================== */

        .account-info {
            margin-top: 35px;

            padding-top: 25px;

            border-top:
                1px solid
                rgba(255,255,255,0.1);

            display: flex;
            justify-content: space-between;
            gap: 20px;

            color:
                rgba(255,255,255,0.55);

            font-size: 12px;
        }


        .account-status {
            display: flex;
            align-items: center;
            gap: 7px;
        }


        .status-dot {
            width: 8px;
            height: 8px;

            border-radius: 50%;

            background: #39e58c;

            box-shadow:
                0 0 10px
                rgba(57,229,140,0.8);
        }


        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 650px) {

            .profile-page {
                padding: 20px 14px;
            }

            .profile-card {
                padding: 25px 20px;

                border-radius: 22px;
            }

            .profile-header {
                gap: 15px;
            }

            .profile-avatar {
                width: 70px;
                height: 70px;

                font-size: 26px;
            }

            .profile-title h1 {
                font-size: 24px;
            }

            .profile-form {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

            .profile-actions {
                flex-direction: column;
            }

            .profile-btn {
                width: 100%;
            }

            .account-info {
                flex-direction: column;
            }
        }

    </style>

</head>


<body>


    <!-- =====================================================
         BACKGROUND
    ===================================================== -->

    <div class="profile-bg">

        <div class="profile-orb orb-one"></div>

        <div class="profile-orb orb-two"></div>

    </div>


    <!-- =====================================================
         PROFILE
    ===================================================== -->

    <main class="profile-page">

        <section class="profile-card">


            <!-- HEADER -->

            <div class="profile-header">

                <div
                    class="profile-avatar"
                    id="profileAvatar"
                >
                    U
                </div>


                <div class="profile-title">

                    <h1>
                        My Profile
                    </h1>

                    <p>
                        Manage your CloudCalc Pro account
                    </p>

                </div>

            </div>


            <!-- FORM -->

            <form
                class="profile-form"
                id="profileForm"
            >


                <!-- FULL NAME -->

                <div class="form-group full">

                    <label for="fullName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="fullName"
                        class="profile-input"
                        placeholder="Enter your full name"
                        autocomplete="name"
                    >

                </div>


                <!-- EMAIL -->

                <div class="form-group full">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        class="profile-input"
                        placeholder="Your email"
                        readonly
                    >

                </div>


            </form>


            <!-- ACTIONS -->

            <div class="profile-actions">

                <button
                    type="button"
                    class="profile-btn save-btn"
                    id="saveProfile"
                >
                    Save Changes
                </button>


                <button
                    type="button"
                    class="profile-btn logout-btn"
                    id="logoutButton"
                >
                    Logout
                </button>

            </div>


            <!-- ACCOUNT STATUS -->

            <div class="account-info">

                <div class="account-status">

                    <span class="status-dot"></span>

                    <span>
                        Account connected
                    </span>

                </div>


                <span id="accountEmail">
                    CloudCalc Pro
                </span>

            </div>


        </section>

    </main>


    <!-- =====================================================
         SCRIPTS
    ===================================================== -->

    <!-- 1. Supabase library FIRST -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>


    <!-- 2. Your Supabase client SECOND -->

    <script src="../js/supabaseClient.js"></script>


    <!-- 3. Profile logic THIRD -->

    <script src="../js/profile.js"></script>


    <script>

        /*
         * Update avatar and account email
         * after profile.js loads the user.
         */

        async function setupProfileVisuals() {

            const {
                data: {
                    user
                }
            } =
                await window
                    .supabaseClient
                    .auth
                    .getUser();


            if (!user) {
                return;
            }


            const name =
                user.user_metadata?.full_name ||
                user.email ||
                "User";


            const avatar =
                document.getElementById(
                    "profileAvatar"
                );


            if (avatar) {

                avatar.textContent =
                    name
                        .charAt(0)
                        .toUpperCase();

            }


            const accountEmail =
                document.getElementById(
                    "accountEmail"
                );


            if (accountEmail) {

                accountEmail.textContent =
                    user.email || "";

            }

        }


        document.addEventListener(
            "DOMContentLoaded",
            () => {

                setupProfileVisuals();


                const saveButton =
                    document.getElementById(
                        "saveProfile"
                    );


                if (saveButton) {

                    saveButton.addEventListener(
                        "click",
                        saveProfile
                    );

                }


                const logoutButton =
                    document.getElementById(
                        "logoutButton"
                    );


                if (logoutButton) {

                    logoutButton.addEventListener(
                        "click",
                        logout
                    );

                }

            }
        );

    </script>

<!-- Supabase CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Supabase Client -->
<script src="../js/supabaseClient.js"></script>

<!-- Profile JS -->
<script src="../js/pages/profile.js"></script>

</body>
</html>
